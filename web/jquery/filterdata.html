      table {

      }
    </style>

    <input id="myInput" type="text" placeholder="Search.." />
    <br /><br />

    <table>

        <tr>
          <th>ID</th>
          <th>Firstname</th>
          <th>Lastname</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody id="myTable">
      </tbody>
    </table>
    <!-- js -->
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/filterdata.js"></script>

</html>
