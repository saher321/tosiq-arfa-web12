<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css" />

    <style>
        .form-check-input:checked{
            background-color: blueviolet;
            border-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="container my-4">
        <!-- Grid start -->

         <h1>Shipping Address</h1>
         <a href="list.html" class="btn btn-primary">Add Data</a>
         <section class="my-3 myform">
            <form class="row g-3">
                <div class="col-lg-6 col-sm-4">
                    <label>First Name</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-lg-6 col-sm-4">
                    <label>Last Name</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-lg-12 col-sm-4">
                    <label>Email</label>
                    <input type="email" class="form-control">
                </div>
                <div class="col-lg-12">
                    <label>Address</label>
                    <textarea class="form-control"></textarea>
                </div>
                <div class="col-lg-4">
                    <label>Country</label>
                    <select class="form-select">
                        <option>Pakistan</option>
                        <option>US</option>
                        <option>UAE</option>
                    </select>
                </div>
                <div class="col-lg-4">
                    <label>State</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-lg-4">
                    <label>Zip code</label>
                    <input type="number" class="form-control">
                </div>
                <div class="col-lg-12">
                    <label>Payment method</label>
                    <input type="radio" class="form-check-input" name="payment"> Visa Card
                    <input type="radio" class="form-check-input" name="payment"> Cash on delivery
                </div>
                <div class="col-lg-12">
                    <button type="submit" class="btn btn-primary">Save shipment address</button>
                </div>
            </form>
         </section>
    </div>
</body>
</html>
